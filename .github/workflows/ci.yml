name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check required secrets
        run: |
          if [ -z "$POSTGRES_URL" ]; then
            echo "::error::POSTGRES_URL is empty. Add it under Settings → Secrets and variables → Actions (name must be exactly POSTGRES_URL). Values are not read from .env in CI."
            exit 1
          fi
          if [ -z "$AUTH_SECRET" ]; then
            echo "::error::AUTH_SECRET is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: pnpm run lint
      - run: pnpm run build
